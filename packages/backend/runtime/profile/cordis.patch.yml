# Application-owned configuration; the official DSH package remains unchanged.
- id: llm-deepseek
  config:
    apiKeyEnv: AURA_DEMO_KEY
    baseURL: !!js process.env.AURA_DEMO_BASE_URL
    thinking: disabled
    maxTokens: 2048
- id: llm-pi-ai
  config:
    providers:
      openai-codex:
        reasoning: medium
        transport: sse
        cacheRetention: short
        maxRequestImageBytes: 20971520
        requestImagePixelBudget: 4194304
        requestImageMaxBytes: 1048576
- id: system-prompt
  config:
    persona: 'You are Aura, a concise and practical personal workbench assistant. The user payload contains the complete conversation as JSON. Answer the final user message in the user language. In demo mode the response is generated locally.'
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('aura-sdk-sessions')
    compression: none
