name: Develop requirements into dev

on:
  push:
    branches: [main]
    paths:
      - "docs/requirements/*.md"

permissions:
  contents: read

concurrency:
  group: requirements-dev-${{ github.repository }}
  queue: max

jobs:
  develop:
    if: >-
      github.repository == 'zzmelody/aura' &&
      github.actor == 'zzmelody' &&
      github.triggering_actor == 'zzmelody' &&
      github.ref == 'refs/heads/main'
    runs-on: [zzmelody-aura-win]
    timeout-minutes: 360
    outputs:
      has_changes: ${{ steps.develop.outputs.has_changes }}
      has_failures: ${{ steps.develop.outputs.has_failures }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.5.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Preserve trusted CI scripts
        run: |
          $trusted = Join-Path $env:RUNNER_TEMP 'requirements-ci/trusted'
          New-Item -ItemType Directory -Force -Path $trusted | Out-Null
          Copy-Item -LiteralPath 'scripts/ci/requirements-ci.ts', 'scripts/ci/requirements-ci-core.ts', 'scripts/ci/windows/Run-CodexWithGpuLock.ps1' -Destination $trusted
      - name: Develop changed requirements
        id: develop
        env:
          CI_EXPECTED_REPOSITORY: zzmelody/aura
          CI_PROFILE: aura
        run: node (Join-Path $env:RUNNER_TEMP 'requirements-ci/trusted/requirements-ci.ts') develop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: requirements-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements-ci/artifact
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: develop
    if: needs.develop.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      stale: ${{ steps.publish.outputs.stale }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: requirements-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements-ci/artifact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Fast-forward dev
        id: publish
        env:
          CI_EXPECTED_REPOSITORY: zzmelody/aura
          CI_PROFILE: aura
        run: node scripts/ci/requirements-ci.ts publish

  reconcile:
    needs: [develop, publish]
    if: needs.publish.outputs.stale == 'true'
    runs-on: [zzmelody-aura-win]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: requirements-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements-ci/artifact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.5.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Preserve trusted CI scripts
        run: |
          $trusted = Join-Path $env:RUNNER_TEMP 'requirements-ci/trusted'
          New-Item -ItemType Directory -Force -Path $trusted | Out-Null
          Copy-Item -LiteralPath 'scripts/ci/requirements-ci.ts', 'scripts/ci/requirements-ci-core.ts', 'scripts/ci/windows/Run-CodexWithGpuLock.ps1' -Destination $trusted
      - name: Reconcile with current dev
        env:
          CI_EXPECTED_REPOSITORY: zzmelody/aura
          CI_PROFILE: aura
        run: node (Join-Path $env:RUNNER_TEMP 'requirements-ci/trusted/requirements-ci.ts') reconcile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requirements-reconciled-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements-ci/artifact
          if-no-files-found: error
          retention-days: 7

  republish:
    needs: [develop, publish, reconcile]
    if: needs.publish.outputs.stale == 'true' && needs.reconcile.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: requirements-reconciled-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/requirements-ci/artifact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Publish reconciled dev
        id: publish
        env:
          CI_EXPECTED_REPOSITORY: zzmelody/aura
          CI_PROFILE: aura
        run: node scripts/ci/requirements-ci.ts publish
      - if: steps.publish.outputs.stale == 'true'
        run: exit 1

  report:
    needs: [develop, publish, reconcile, republish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report incomplete requirements or publication
        env:
          DEVELOP_RESULT: ${{ needs.develop.result }}
          HAS_CHANGES: ${{ needs.develop.outputs.has_changes }}
          HAS_FAILURES: ${{ needs.develop.outputs.has_failures }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_STALE: ${{ needs.publish.outputs.stale }}
          REPUBLISH_RESULT: ${{ needs.republish.result }}
        run: |
          if [ "$DEVELOP_RESULT" != "success" ] || [ "$HAS_FAILURES" = "true" ]; then exit 1; fi
          if [ "$HAS_CHANGES" = "true" ] && [ "$PUBLISH_RESULT" != "success" ]; then exit 1; fi
          if [ "$PUBLISH_STALE" = "true" ] && [ "$REPUBLISH_RESULT" != "success" ]; then exit 1; fi
