name: Local CI

on:
  workflow_dispatch:
    inputs:
      graphics_mode:
        description: Godot graphics check in the CI desktop session
        type: choice
        required: true
        default: none
        options: [none, foreground, switched, locked]

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.repository == 'zzmelody/aura' &&
      github.actor == 'zzmelody' &&
      github.triggering_actor == 'zzmelody' &&
      github.ref == 'refs/heads/main' &&
      inputs.graphics_mode == 'none'
    runs-on: [zzmelody-aura-win]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch history from the local mirror
        run: git fetch --no-tags C:/ci-runners/mirrors/aura.git "+refs/heads/*:refs/remotes/origin/*"
      - name: Install dependencies from the shared store
        run: |
          $env:PATH = "C:\ci-control\tools\node;C:\ci-control\tools\pnpm;$env:PATH"
          pnpm install --frozen-lockfile --store-dir C:\ci-runners\cache\pnpm
      - name: Check the workspace
        run: |
          $env:PATH = "C:\ci-control\tools\node;C:\ci-control\tools\pnpm;$env:PATH"
          pnpm run check

  graphics:
    if: >-
      github.repository == 'zzmelody/aura' &&
      github.actor == 'zzmelody' &&
      github.triggering_actor == 'zzmelody' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.graphics_mode != 'none'
    runs-on: [zzmelody-aura-win]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture an RTX 4080 frame
        env:
          GRAPHICS_MODE: ${{ inputs.graphics_mode }}
        run: |
          $mode = $env:GRAPHICS_MODE
          if ($mode -notin @('foreground', 'switched', 'locked')) { throw 'Invalid graphics mode.' }
          $project = 'C:\ci-runners\graphics-probe'
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Copy-Item -LiteralPath 'scripts/ci/godot-probe/project.godot', 'scripts/ci/godot-probe/probe.tscn', 'scripts/ci/godot-probe/probe.gd' -Destination $project -Force
          Write-Host 'Capturing in 30 seconds. Arrange the CI desktop state now.'
          Start-Sleep -Seconds 30
          & 'scripts/ci/windows/Invoke-GpuLocked.ps1' -FilePath 'C:\ci-control\tools\Godot_v4.7.2-stable_win64_console.exe' -ArgumentList @('--path', $project, '--', $mode)
          if ($LASTEXITCODE -ne 0) { throw "Godot exited with code $LASTEXITCODE" }
          $report = Get-Content -LiteralPath (Join-Path $project "$mode.json") -Raw | ConvertFrom-Json
          if (-not $report.passed) { throw 'Godot did not produce a valid RTX 4080 frame.' }
          Write-Host "Screenshot: $project\$mode.png"
